<!doctype html><html><body style="margin:0;background:#000">
<canvas id="c" width="480" height="360" style="width:480px;height:360px"></canvas>
<script src="node_modules/scratch-storage/dist/web/scratch-storage.js"></script>
<script src="node_modules/scratch-svg-renderer/dist/web/scratch-svg-renderer.js"></script>
<script src="node_modules/scratch-render/dist/web/scratch-render.js"></script>
<script src="node_modules/scratch-vm/dist/web/scratch-vm.js"></script>
<script>
window.log=[];
async function boot(url){
  const vm = new window.VirtualMachine();
  const storage = new (window.ScratchStorage.ScratchStorage || window.ScratchStorage)();
  vm.attachStorage(storage);
  const canvas = document.getElementById('c');
  const renderer = new window.ScratchRender(canvas);
  vm.attachRenderer(renderer);
  const SR = window.ScratchSVGRenderer; vm.attachV2BitmapAdapter(new SR.BitmapAdapter());
  vm.setCompatibilityMode(true);
  const buf = await (await fetch(url)).arrayBuffer();
  await vm.loadProject(buf);
  window.vm = vm;
  window.vm = vm; if (window.hookBot) hookBot();
  window.sndlog = [];
  for (const op of ['sound_play','sound_playuntildone']) { const f = vm.runtime._primitives[op]; vm.runtime._primitives[op] = function(args, util){ sndlog.push([+gv('frame'), util.target.getName(), String(args.SOUND_MENU), op]); return f.call(this, args, util); }; }
  vm.start();
  vm.greenFlag();
  return vm.runtime.targets.length;
}
window.key=(k,down)=>vm.postIOData('keyboard',{key:k,isDown:down});
window.mouse=(x,y,down)=>vm.postIOData('mouse',{x:x+240,y:180-y,canvasWidth:480,canvasHeight:360,isDown:down});
window.sv=(name,val)=>{const st=vm.runtime.getTargetForStage();for(const id in st.variables){if(st.variables[id].name===name){st.variables[id].value=val;return true;}}return false;};
window.lv=(spr,name)=>{const t=vm.runtime.getSpriteTargetByName(spr);for(const id in t.variables){if(t.variables[id].name===name)return t.variables[id].value;}return undefined;};
window.gl=(name)=>{const st=vm.runtime.getTargetForStage();for(const id in st.variables){if(st.variables[id].name===name)return st.variables[id].value;}return undefined;};
window.gv=(name)=>{const st=vm.runtime.getTargetForStage();for(const id in st.variables){if(st.variables[id].name===name)return st.variables[id].value;}return undefined;};
</script><script src="bot.js"></script></body></html>
